name: Push recuperi Coach

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: push-recuperi-coach
  cancel-in-progress: false

jobs:
  send-recovery-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa Firebase Admin
        run: npm install --no-save firebase-admin

      - name: Controlla recuperi e invia push
        env:
          FIREBASE_SERVICE_ACCOUNT_MAIN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAIN }}
        run: node scripts/send-recovery-push.cjs
